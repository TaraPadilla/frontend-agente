services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: alianza-f1-agent-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
