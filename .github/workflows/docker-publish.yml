name: Publish and Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/tarapadilla/frontend-agente
  DEPLOY_PATH: /home/opc/Proyectos/agente-frontend
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}

jobs:
  publish-and-deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'

    runs-on: ubuntu-latest

    steps:
      - name: Descargar commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_GA_MEASUREMENT_ID=${{ env.VITE_GA_MEASUREMENT_ID }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configurar acceso SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key

          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts

      - name: Transferir Compose del commit validado
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          scp -i ~/.ssh/oci_key \
            compose.yaml \
            "$OCI_USER@$OCI_HOST:${DEPLOY_PATH}/compose.yaml.next"

      - name: Desplegar en OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/oci_key "$OCI_USER@$OCI_HOST" "
            set -e

            cd '${{ env.DEPLOY_PATH }}'

            mv compose.yaml.next compose.yaml

            IMAGE_TAG='$IMAGE_TAG' docker compose pull frontend
            IMAGE_TAG='$IMAGE_TAG' docker compose up -d --remove-orphans frontend

            CONTENEDOR=\$(IMAGE_TAG='$IMAGE_TAG' docker compose ps -q frontend)
            if [ -z \"\$CONTENEDOR\" ]; then
              echo 'No se encontró el contenedor del servicio frontend.'
              IMAGE_TAG='$IMAGE_TAG' docker compose logs --tail 100 frontend
              exit 1
            fi

            echo 'Esperando el healthcheck del servicio frontend...'
            for intento in \$(seq 1 30); do
              ESTADO=\$(docker inspect --format '{{.State.Status}}' \"\$CONTENEDOR\")
              SALUD=\$(docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                \"\$CONTENEDOR\")

              echo \"Servicio frontend: estado=\$ESTADO health=\$SALUD\"

              if [ \"\$ESTADO\" = 'running' ] && [ \"\$SALUD\" = 'healthy' ]; then
                echo 'Servicio frontend verificado correctamente.'
                break
              fi

              if [ \"\$ESTADO\" = 'exited' ] || \
                 [ \"\$ESTADO\" = 'dead' ] || \
                 [ \"\$SALUD\" = 'unhealthy' ] || \
                 [ \"\$SALUD\" = 'missing' ]; then
                IMAGE_TAG='$IMAGE_TAG' docker compose logs --tail 100 frontend
                exit 1
              fi

              if [ \"\$intento\" -eq 30 ]; then
                echo 'El servicio frontend no alcanzó un estado saludable.'
                IMAGE_TAG='$IMAGE_TAG' docker compose logs --tail 100 frontend
                exit 1
              fi

              sleep 5
            done

            docker image prune -f
          "
